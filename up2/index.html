<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mensaje Importante</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Roboto', sans-serif;
      background-color: #fff;
      color: #000;
    }

    .alert-top {
      background-color: #d10000;
      color: white;
      padding: 15px;
      font-weight: 900;
      font-size: 2rem;
      text-align: center;
    }
    .alert-top strong {
      color: #ffeb3b;
    }

    .content {
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
      text-align: center;
    }

    h1 span{
      color: #791c5c;
      font-size: 1.8rem;
      font-weight: 900;
      line-height: 1.4;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 1.3rem;
      font-weight: 500;
      color: #000;
      margin-bottom: 30px;
    }

    .video-placeholder {
      background-color: #6b004a;
      height: 340px;
      border-radius: 6px;
      margin: 0 auto 30px;
      position: relative;
    }

    .warning {
      font-size: 1.1rem;
      color: #791c5c;
      font-weight: 400;
    }
    .warning strong {
      font-weight: 700;
    }

  </style>
  <script
  src="https://cdn.utmify.com.br/scripts/utms/latest.js"
  data-utmify-prevent-subids
  async
  defer
  ></script>
</head>
<body>

  <div class="alert-top">
    <strong>¡Hola!</strong><BR> usa el botón de abajo para acceder a tu dibujo.
  </div>

  <main class="content">
    <h1> El Universo <span>OCULTA ALGUNA INFORMACIÓN</span>  about your future...</h1>

    <p class="warning">
      ⚠️ ¡Mira cómo dibujo a tu alma gemela!
    </p>
    <!-- HOTMART - Sales Funnel Widget -->
    <!--- sales funnel container --->
    <div id="hotmart-sales-funnel"></div>

    <!--- script load and setup --->
    <script src="https://checkout.hotmart.com/lib/hotmart-checkout-elements.js"></script>
    <script>
    checkoutElements.init('salesFunnel').mount('#hotmart-sales-funnel')
    </script>
    <!-- HOTMART - Sales Funnel Widget -->
  </main>
  <script>
      document.addEventListener("DOMContentLoaded", function () {
          function getAllParams(url) {
              const urlObj = new URL(url);
              let paramString = "";

              // Iterando sobre todos os parâmetros da URL
              for (const [key, value] of urlObj.searchParams) {
                  paramString += `${paramString ? '&' : ''}${key}=${value}`;
              }

              return paramString;
          }

          const params = getAllParams(window.location.href);

          if (params) {
              const links = document.querySelectorAll("a");

              links.forEach(link => {
                  const separator = link.href.includes("?") ? "&" : "?";
                  link.href += `${separator}${params}`;
              });
          }
      });
    </script>

</body>
</html>
